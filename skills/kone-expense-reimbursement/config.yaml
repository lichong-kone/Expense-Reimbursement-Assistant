# WorkBuddy / 通用 Agent Skill Configuration
# kone-expense-reimbursement v1.3.0 (public / universal)

skill:
  id: kone-expense-reimbursement
  name: KONE Expense Reimbursement (Universal Skill)
  version: 1.3.0
  mode: portable

triggers:
  - intent: expense_reimbursement
    patterns:
      - "整理报销"
      - "生成报销单"
      - "报销发票"
      - "fill reimbursement"
      - "报销这些发票"
      - "填报销申请表"
  - intent: policy_check
    patterns:
      - "检查政策"
      - "check policy"
      - "超标了吗"
      - "是否合规"

execution:
  runtime: node
  minVersion: "18"
  entryPoint: portable-core.mjs
  timeout: 30s
  sandbox: true

cli:
  init: "--init <path>"
  validate: "--validate --input <path>"
  run: "--input <path> [--output-dir <dir>] [--decisions <path>] [--state <path>]"

# Local datasource + onboarding (Spec §6.8.6.11–12). These entry points let a host
# Agent run FIXED scripts for setup / precheck / collection instead of improvising.
datasource:
  setup:
    entryPoint: ../../scripts/local-collector/setup.mjs
    description: "Guided onboarding — persists sources.json + employee.json. Interactive or non-interactive flags. Never writes credentials."
    cli: "--mode local|mailbox|both [--provider qq|163|126|gmail|outlook|yeah] [--name ...] [--mailbox-user ...] [--password-env VAR] [--print] [--show]"
  precheck:
    entryPoint: ../../scripts/local-collector/index.mjs
    description: "Mailbox connectivity precheck (TCP + IMAP, with timeouts). Reports corporate-network/proxy blocking clearly."
    cli: "--config <sources.json> --precheck"
  collect:
    entryPoint: ../../scripts/local-collector/index.mjs
    description: "End-to-end pipeline: mailbox fetch (with precheck) → extract → policy review → optional formal Excel."
    cli: "--config <sources.json> [--once|--watch <seconds>]"
  modes: [local, mailbox, both]
  requiresDeps: [imapflow, pdf-parse, adm-zip, tesseract.js]
  credentials: "IMAP password/auth-code via env var only (default REBU_IMAP_PASS) or host Secret Store; never in sources.json/logs."

resources:
  policyRules: resources/policy-rules.json

outputs:
  directory: output/
  artifacts:
    - summary.md
    - reimbursement-draft.json
    - policy-report.json
    - policy-findings.json
    - review-questions.md
    - review-questions.json
    - review-decisions.template.json
    - decision-log.json
    - template-input.json
    - host-contract.json
    - audit.ndjson
    - manifest.json

permissions:
  network: false
  filesystem: read_write_output_only
  secrets: none

hostResponsibilities:
  - "PDF/OFD/XML file parsing and text extraction"
  - "File storage and access control"
  - "User authentication and session management"
  - "Rendering the final document from template-input.json / host-contract.json"

distribution:
  notice: >
    Public package: policy + organization + review + structured outputs + official-template
    Excel rendering. Bundled with one official reimbursement template and the template adapter
    (requires adm-zip). Internal policy PDFs and backend code are not included.
  officialExcelRendering: bundled

metadata:
  company: KONE/通力
  domain: expense_reimbursement
  locale: zh-CN
  templateDistribution: false
